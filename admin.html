<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin - Sensors</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #071029;
            color: #e6eef8;
            padding: 20px
        }

        .card {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 10px
        }

        button {
            padding: 8px 10px;
            border-radius: 6px
        }

        .danger {
            background: #f87171;
            color: #2b0505;
            border: none
        }
    </style>
</head>

<body>
    <h1>Admin - Sensors</h1>
    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
        <input id="username" placeholder="username"
            style="padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#e6eef8;" />
        <input id="password" type="password" placeholder="password"
            style="padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#e6eef8;" />
        <button id="login">Login</button>
        <button id="logout">Logout</button>
        <div id="authStatus" style="margin-left:12px;color:#9cc4ff"></div>
    </div>

    <div id="list"></div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass }), credentials: 'same-origin' });
                if (!res.ok) { alert('Login failed'); return; }
                document.getElementById('authStatus').textContent = 'Logged in';
                load();
            } catch (e) { alert('Login error'); }
        }

        async function logout() { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); document.getElementById('authStatus').textContent = 'Logged out'; }

        async function load() {
            const res = await fetch('/api/sensors');
            const items = await res.json();
            const list = document.getElementById('list');
            list.innerHTML = '';
            items.forEach(s => {
                const el = document.createElement('div'); el.className = 'card';
                el.innerHTML = `<strong>${s.name}</strong> <br/> ${s.lat}, ${s.lng} <br/> <button onclick="remove(${s.id})" class='danger'>Delete</button>`;
                list.appendChild(el);
            });
        }

        async function remove(id) {
            try {
                const res = await fetch('/api/sensors/' + id, { method: 'DELETE', credentials: 'same-origin' });
                if (res.status === 401) { alert('Unauthorized. Login first.'); return; }
                if (res.ok) { load(); } else { alert('Failed: ' + res.status); }
            } catch (e) { alert('Error: ' + e.message); }
        }

        document.getElementById('login').addEventListener('click', login);
        document.getElementById('logout').addEventListener('click', logout);
        // Check login status by probing a protected endpoint
        (async function () {
            try {
                const res = await fetch('/api/sensors', { method: 'GET', credentials: 'same-origin' });
                if (res.ok) document.getElementById('authStatus').textContent = 'Ready';
            } catch (e) { }
        })();
        load();
    </script>
</body>

</html>
